# The ai-tools track is owned by its team; see CODEOWNERS.
# `track` must match its entry in roadmap/index.yaml.

track: ai-tools

categories:
  - id: analysis
    label: Analysis
  - id: methods
    label: Methods
  - id: models-access
    label: Models and access

entries:
  - id: more-accurate-answers
    title: More accurate answers
    description: >-
      Studio adds up years only when you ask it to, includes multilateral donors
      in top-donor questions, returns sectors for by-sector questions, and
      divides shares by the right total. A donor whose data stops early is left
      out with a note, and the analysis continues.
    categories: [analysis]
    status: released
    released_on: "2026-10-25"

  - id: clearer-plans-and-steps
    title: Clearer plans and fewer false failures
    description: >-
      Plans and cards use consistent wording, chart titles take their period
      from the data, and coverage notes name the series that fall short. A step
      that succeeds on a retry says so.
    categories: [analysis]
    status: released
    released_on: "2026-10-25"

  - id: clarifying-questions
    title: Several clarifying questions at once
    description: >-
      When a question is ambiguous, Studio can ask up to three clarifying
      questions in one pause and keeps your answers in the conversation.
    categories: [analysis]
    status: released
    released_on: "2026-10-23"

  - id: new-analytical-operations
    title: New analytical operations
    description: >-
      Studio can give one figure across every row, join tables whose key
      columns have different names, and compute each donor's share of a pooled
      total.
    categories: [analysis]
    status: released
    released_on: "2026-10-24"

  - id: studio-daily-limits
    title: Daily Studio limits
    description: >-
      Studio allows 5 prompts a day for guests and 75 for signed-in users.
    categories: [models-access]
    status: released
    released_on: "2026-10-23"

  - id: faster-reliable-answers
    title: Faster and more reliable answers
    description: >-
      Reduce the time Studio takes to find data and complete an analysis. Improve
      how it asks for clarification and handles failed steps.
    categories: [analysis]
    status: planned
    expected: "2026-Q4"

  - id: saved-reproducible-analyses
    title: Saved reproducible analyses
    description: >-
      Save and download an analysis with its method, data versions, and
      calculations, then rerun it or use it as the starting point for further
      work.
    categories: [analysis]
    status: under-consideration

  - id: more-analytical-operations
    title: More analytical operations
    description: >-
      Add new analytical operations to support a wider range of development
      finance questions.
    categories: [analysis]
    status: planned
    expected: "2026-Q4"

  - id: more-development-finance-methods
    title: More development finance methods
    description: >-
      Apply additional documented approaches to aid, debt, and health-financing
      questions, with assumptions, source guidance, and methodological choices
      available for review.
    categories: [analysis, methods]
    status: under-consideration

  - id: more-model-provider-options
    title: More model and provider options
    description: >-
      Support additional AI models and inference providers for DFO analysis.
    categories: [models-access]
    status: under-consideration

  - id: adjustable-analysis-depth
    title: Adjustable analysis depth
    description: >-
      Choose a quick answer or a more thorough analysis for a complex question,
      with the effect on response time explained before starting.
    categories: [analysis]
    status: under-consideration

  - id: account-usage-limits
    title: Account usage
    description: >-
      See the AI usage available to your account and how much has been used.
    categories: [models-access]
    status: under-consideration
