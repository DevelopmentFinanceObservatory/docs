# here. `description` is optional intro copy for a tab; a track with nothing to say
# yet omits it rather than carrying invented copy.
#
# Each id here names a roadmap/<id>.yaml file, owned by that track's team; see
# CODEOWNERS.

- id: data
  label: Data
  description: >-
    Datasets and coverage the data team is building, has shipped, or is still
    weighing.
- id: platform
  label: Platform
- id: ai-tools
  label: AI tools
